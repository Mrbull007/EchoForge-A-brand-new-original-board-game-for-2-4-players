<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EchoForge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; padding: 16px; background: #1f2937; border-radius: 16px; }
    .cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-size: 2rem; border-radius: 8px; position: relative; cursor: pointer; transition: all 0.2s; }
    .token { position: absolute; bottom: 4px; right: 4px; font-size: 1.5rem; filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.5)); }
    .highlight { box-shadow: 0 0 0 4px #22c55e inset; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 6px #86efac inset; } }
  </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-purple-950 text-white min-h-screen">
  <div class="max-w-7xl mx-auto p-6">
    <h1 class="text-6xl font-bold text-center mb-2 tracking-tighter">ECHO<span class="text-amber-400">FORGE</span></h1>
    <p class="text-center text-amber-300 mb-8">Forge 3 Relics • Return to the Core • Win the Timeline</p>

    <!-- Game Header -->
    <div class="flex justify-between items-center mb-6 bg-slate-800/70 backdrop-blur rounded-2xl p-4">
      <div class="flex items-center gap-3">
        <div id="currentPlayer" class="text-3xl font-bold"></div>
        <div id="rollResult" class="w-16 h-16 flex items-center justify-center text-5xl font-black bg-amber-400 text-slate-900 rounded-2xl shadow-inner"></div>
      </div>
      <button onclick="rollDice()" id="rollBtn"
        class="bg-amber-400 hover:bg-amber-300 text-slate-900 px-8 py-3 rounded-2xl text-2xl font-bold transition">ROLL DICE</button>
      <button onclick="endTurn()" class="bg-slate-700 hover:bg-slate-600 px-6 py-3 rounded-2xl text-lg font-medium">END TURN</button>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
      <!-- BOARD -->
      <div class="lg:col-span-7">
        <div id="board" class="board"></div>
      </div>

      <!-- SIDE PANEL -->
      <div class="lg:col-span-5 space-y-6">
        <!-- Player 1 -->
        <div id="player1Panel" class="bg-slate-800 rounded-3xl p-5">
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3"><span class="text-4xl">🔴</span><span class="text-2xl font-bold">Red EchoSmith</span></div>
            <div class="text-3xl font-bold" id="p1Forged">0 / 3</div>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center" id="p1Shards"></div>
        </div>

        <!-- Player 2 -->
        <div id="player2Panel" class="bg-slate-800 rounded-3xl p-5">
          <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3"><span class="text-4xl">🔵</span><span class="text-2xl font-bold">Blue EchoSmith</span></div>
            <div class="text-3xl font-bold" id="p2Forged">0 / 3</div>
          </div>
          <div class="grid grid-cols-4 gap-2 text-center" id="p2Shards"></div>
        </div>

        <!-- Forge Relics -->
        <div class="bg-slate-800 rounded-3xl p-5">
          <h3 class="text-xl font-bold mb-4 text-amber-300">FORGE RELICS (click to craft)</h3>
          <div id="relicList" class="space-y-3"></div>
        </div>

        <!-- Status -->
        <div id="status" class="text-center text-lg font-medium min-h-[60px]"></div>
      </div>
    </div>

    <div class="text-center mt-8 text-slate-400 text-sm">
      Hotseat mode • 2 players • Copy this file and play with friends!<br>
      <button onclick="resetGame()" class="underline hover:text-white">Reset Game</button>
    </div>
  </div>

  <script>
    // Tailwind script already loaded
    function initTailwind() {
      // Already initialized via CDN
    }

    // Game data
    let players = [
      { id: 1, name: "Red", symbol: "🔴", color: "red", row: 0, col: 0, shards: { ancient: 0, medieval: 0, industrial: 0, future: 0 }, forged: 0 },
      { id: 2, name: "Blue", symbol: "🔵", color: "blue", row: 0, col: 4, shards: { ancient: 0, medieval: 0, industrial: 0, future: 0 }, forged: 0 }
    ]
    let currentPlayerIndex = 0
    let currentRoll = 0
    let gameOver = false

    // Board special squares (row 0-4, col 0-4)
    const specials = {
      "2-2": { type: "core", icon: "⭐" },
      "1-1": { type: "era", subtype: "ancient", icon: "🟦" },
      "1-3": { type: "era", subtype: "medieval", icon: "🟩" },
      "3-1": { type: "era", subtype: "industrial", icon: "🟧" },
      "3-3": { type: "era", subtype: "future", icon: "🟪" },
      "0-2": { type: "portal", icon: "🔄" },
      "2-0": { type: "portal", icon: "🔄" },
      "2-4": { type: "portal", icon: "🔄" },
      "4-2": { type: "portal", icon: "🔄" },
      "0-1": { type: "hazard", icon: "☠️" },
      "1-4": { type: "hazard", icon: "☠️" },
      "3-0": { type: "hazard", icon: "☠️" },
      "4-3": { type: "hazard", icon: "☠️" }
    }

    const relicTemplates = [
      { name: "Time Anchor", req: { ancient: 2, medieval: 1, industrial: 0, future: 0 }, icon: "⏳" },
      { name: "Gearheart", req: { ancient: 0, medieval: 0, industrial: 2, future: 1 }, icon: "⚙️" },
      { name: "Runeblade", req: { ancient: 1, medieval: 2, industrial: 0, future: 0 }, icon: "🗡️" },
      { name: "Starforge", req: { ancient: 0, medieval: 0, industrial: 1, future: 2 }, icon: "⭐" },
      { name: "Eternal Flame", req: { ancient: 1, medieval: 1, industrial: 1, future: 1 }, icon: "🔥" }
    ]

    function getCellKey(r, c) { return `${r}-${c}` }

    function renderBoard() {
      const board = document.getElementById("board")
      board.innerHTML = ""
      board.style.gridTemplateColumns = "repeat(5, 1fr)"

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          const cell = document.createElement("div")
          cell.className = "cell bg-slate-700 hover:bg-slate-600 flex-col"
          cell.dataset.row = r
          cell.dataset.col = c

          const key = getCellKey(r, c)
          if (specials[key]) {
            cell.innerHTML = `<span class="text-5xl">${specials[key].icon}</span>`
            if (specials[key].type === "core") cell.style.backgroundColor = "#854d0e"
            if (specials[key].type === "portal") cell.style.backgroundColor = "#334155"
          }

          // Add tokens
          players.forEach(p => {
            if (p.row === r && p.col === c) {
              const tokenEl = document.createElement("div")
              tokenEl.className = "token"
              tokenEl.textContent = p.symbol
              cell.appendChild(tokenEl)
            }
          })

          // Click handler
          cell.addEventListener("click", () => handleCellClick(r, c))
          board.appendChild(cell)
        }
      }
    }

    function renderPlayers() {
      // Player 1
      const p1 = players[0]
      document.getElementById("p1Forged").innerHTML = `<span class="text-4xl">${p1.symbol}</span> ${p1.forged} / 3`
      let p1HTML = ""
      Object.keys(p1.shards).forEach(type => {
        const val = p1.shards[type]
        const icon = type === "ancient" ? "🟦" : type === "medieval" ? "🟩" : type === "industrial" ? "🟧" : "🟪"
        p1HTML += `<div class="bg-slate-700 rounded-2xl p-2"><div class="text-3xl">${icon}</div><div class="font-bold">${val}</div></div>`
      })
      document.getElementById("p1Shards").innerHTML = p1HTML

      // Player 2
      const p2 = players[1]
      document.getElementById("p2Forged").innerHTML = `<span class="text-4xl">${p2.symbol}</span> ${p2.forged} / 3`
      let p2HTML = ""
      Object.keys(p2.shards).forEach(type => {
        const val = p2.shards[type]
        const icon = type === "ancient" ? "🟦" : type === "medieval" ? "🟩" : type === "industrial" ? "🟧" : "🟪"
        p2HTML += `<div class="bg-slate-700 rounded-2xl p-2"><div class="text-3xl">${icon}</div><div class="font-bold">${val}</div></div>`
      })
      document.getElementById("p2Shards").innerHTML = p2HTML
    }

    function renderRelics() {
      const container = document.getElementById("relicList")
      container.innerHTML = ""
      const currentPlayer = players[currentPlayerIndex]

      relicTemplates.forEach((relic, i) => {
        let canForge = true
        let reqHTML = ""
        Object.keys(relic.req).forEach(type => {
          if (relic.req[type] > 0) {
            const have = currentPlayer.shards[type]
            const needed = relic.req[type]
            const icon = type === "ancient" ? "🟦" : type === "medieval" ? "🟩" : type === "industrial" ? "🟧" : "🟪"
            reqHTML += `<span class="text-2xl">${icon} ${have}/${needed}</span> `
            if (have < needed) canForge = false
          }
        })

        const div = document.createElement("div")
        div.className = `flex items-center justify-between p-4 rounded-2xl ${canForge ? "bg-green-600 hover:bg-green-500" : "bg-slate-700 opacity-60"} cursor-pointer`
        div.innerHTML = `
          <div class="flex items-center gap-4">
            <span class="text-4xl">${relic.icon}</span>
            <div>
              <div class="font-bold text-lg">${relic.name}</div>
              <div class="text-sm">${reqHTML}</div>
            </div>
          </div>
        `
        if (canForge) {
          div.onclick = () => forgeRelic(i)
        }
        container.appendChild(div)
      })
    }

    function updateCurrentPlayerUI() {
      const cp = players[currentPlayerIndex]
      document.getElementById("currentPlayer").innerHTML = `${cp.symbol} <span class="text-2xl">${cp.name} EchoSmith</span>`
    }

    function rollDice() {
      if (gameOver || currentRoll > 0) return
      currentRoll = Math.floor(Math.random() * 6) + 1
      document.getElementById("rollResult").textContent = currentRoll
      document.getElementById("rollBtn").classList.add("opacity-30", "pointer-events-none")
      document.getElementById("status").innerHTML = `<span class="text-amber-400">Move up to ${currentRoll} spaces (Manhattan distance)</span>`
    }

    function isValidMove(fromR, fromC, toR, toC) {
      if (currentRoll === 0) return false
      const dist = Math.abs(toR - fromR) + Math.abs(toC - fromC)
      return dist <= currentRoll
    }

    function handleCellClick(r, c) {
      if (gameOver || currentRoll === 0) return
      const cp = players[currentPlayerIndex]
      if (!isValidMove(cp.row, cp.col, r, c)) return

      // Move
      cp.row = r
      cp.col = c
      currentRoll = 0
      document.getElementById("rollResult").textContent = ""
      document.getElementById("rollBtn").classList.remove("opacity-30", "pointer-events-none")

      resolveLanding(r, c)
      renderBoard()
      renderPlayers()
      renderRelics()
      checkWin()
    }

    function resolveLanding(r, c) {
      const key = getCellKey(r, c)
      const special = specials[key]
      const cp = players[currentPlayerIndex]
      let msg = ""

      if (!special) return

      if (special.type === "era") {
        cp.shards[special.subtype]++
        msg = `+1 ${special.icon} ${special.subtype.toUpperCase()} shard`
      } else if (special.type === "hazard") {
        const types = Object.keys(cp.shards)
        const hasShards = types.some(t => cp.shards[t] > 0)
        if (hasShards) {
          let removed = false
          while (!removed) {
            const t = types[Math.floor(Math.random() * types.length)]
            if (cp.shards[t] > 0) {
              cp.shards[t]--
              removed = true
            }
          }
          msg = `☠️ Lost 1 random shard`
        }
      } else if (special.type === "portal") {
        msg = `🔄 Portal! You may teleport next turn (free action).`
        // For simplicity we allow teleport as immediate bonus option in status
        document.getElementById("status").innerHTML += `<br><button onclick="teleportFromPortal()" class="text-xs bg-purple-600 px-3 py-1 rounded-xl mt-2">TELEPORT NOW (free)</button>`
      }

      document.getElementById("status").innerHTML = msg || "Landed safely"
    }

    function teleportFromPortal() {
      // Simple teleport UI - pick random other portal for demo (you can expand)
      const portalKeys = Object.keys(specials).filter(k => specials[k].type === "portal")
      const currentKey = getCellKey(players[currentPlayerIndex].row, players[currentPlayerIndex].col)
      let targetKey = portalKeys[Math.floor(Math.random() * portalKeys.length)]
      while (targetKey === currentKey) targetKey = portalKeys[Math.floor(Math.random() * portalKeys.length)]

      const [r, c] = targetKey.split("-").map(Number)
      players[currentPlayerIndex].row = r
      players[currentPlayerIndex].col = c
      document.getElementById("status").innerHTML = `Teleported to another portal!`
      renderBoard()
      renderPlayers()
    }

    function forgeRelic(index) {
      const relic = relicTemplates[index]
      const cp = players[currentPlayerIndex]
      let can = true
      Object.keys(relic.req).forEach(t => {
        if (relic.req[t] > cp.shards[t]) can = false
      })
      if (!can) return

      // Consume shards
      Object.keys(relic.req).forEach(t => {
        cp.shards[t] -= relic.req[t]
      })
      cp.forged++
      document.getElementById("status").innerHTML = `🔥 Forged <strong>${relic.name}</strong>!`
      renderPlayers()
      renderRelics()
      checkWin()
    }

    function checkWin() {
      const cp = players[currentPlayerIndex]
      if (cp.forged >= 3 && cp.row === 2 && cp.col === 2) {
        gameOver = true
        document.getElementById("status").innerHTML = `
          <div class="text-5xl font-black text-amber-400 animate-pulse">🎉 ${cp.symbol} ${cp.name} WINS THE TIMELINE! 🎉</div>
        `
      }
    }

    function endTurn() {
      if (gameOver) return
      currentPlayerIndex = (currentPlayerIndex + 1) % players.length
      currentRoll = 0
      document.getElementById("rollResult").textContent = ""
      document.getElementById("rollBtn").classList.remove("opacity-30", "pointer-events-none")
      document.getElementById("status").innerHTML = ""
      updateCurrentPlayerUI()
      renderBoard()
      renderPlayers()
      renderRelics()
    }

    function resetGame() {
      players = [
        { id: 1, name: "Red", symbol: "🔴", color: "red", row: 0, col: 0, shards: { ancient: 0, medieval: 0, industrial: 0, future: 0 }, forged: 0 },
        { id: 2, name: "Blue", symbol: "🔵", color: "blue", row: 0, col: 4, shards: { ancient: 0, medieval: 0, industrial: 0, future: 0 }, forged: 0 }
      ]
      currentPlayerIndex = 0
      currentRoll = 0
      gameOver = false
      document.getElementById("status").innerHTML = ""
      document.getElementById("rollResult").textContent = ""
      renderBoard()
      renderPlayers()
      renderRelics()
      updateCurrentPlayerUI()
    }

    // Initialize game
    window.onload = () => {
      initTailwind()
      renderBoard()
      renderPlayers()
      renderRelics()
      updateCurrentPlayerUI()
      console.log("%cEchoForge ready! Enjoy the new board game 🎲", "color:#f59e0b; font-size:18px")
    }
  </script>
</body>
</html>
